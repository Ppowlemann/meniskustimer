<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meniskus-Motivator 💪🦵</title>
    <style>
      :root {
        --bg: #0f1226;
        --panel: #1a1f45;
        --panel-soft: #202760;
        --accent: #ff7f50;
        --accent-2: #4de2c5;
        --text: #f5f7ff;
        --muted: #b9c0ef;
        --good: #7af29a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 20%, #27327b 0%, var(--bg) 42%, #090c1c 100%);
        display: grid;
        place-items: center;
        padding: 1.25rem;
      }

      .app {
        width: min(980px, 100%);
        background: linear-gradient(170deg, rgba(35, 42, 99, 0.93), rgba(19, 25, 65, 0.95));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        backdrop-filter: blur(8px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .top {
        padding: 1.25rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
      }

      .wink {
        font-size: 1.8rem;
        animation: bounce 1.8s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-4px) rotate(-7deg);
        }
      }

      .content {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 1rem;
        padding: 1rem;
      }

      @media (max-width: 860px) {
        .content {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        padding: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        gap: 0.75rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.88rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        background: var(--panel-soft);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: var(--text);
        border-radius: 12px;
        padding: 0.6rem 0.7rem;
        font-size: 1rem;
      }

      .buttons {
        margin-top: 0.95rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.62rem 1rem;
        font-size: 0.95rem;
        color: #111329;
        cursor: pointer;
        font-weight: 700;
      }

      .start {
        background: linear-gradient(120deg, var(--accent-2), #7af8d3);
      }

      .pause {
        background: linear-gradient(120deg, #ffd15b, #ffbe3d);
      }

      .reset {
        background: linear-gradient(120deg, #ff8f8f, #ff6877);
      }

      .timer-face {
        display: grid;
        justify-items: center;
        gap: 0.9rem;
      }

      .knee-wrap {
        width: min(300px, 70%);
      }

      .knee {
        width: 100%;
        aspect-ratio: 1;
        filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.3));
      }

      .joint {
        transform-origin: center;
        animation: jointPulse 1.2s ease-in-out infinite;
      }

      .joint.resting {
        animation-duration: 1.8s;
      }

      @keyframes jointPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.14);
        }
      }

      .phase {
        font-weight: 800;
        font-size: 1.2rem;
      }

      .clock {
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        font-weight: 900;
        letter-spacing: 0.03em;
      }

      .meta {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        text-align: center;
      }

      .chip {
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-size: 0.86rem;
      }

      .progress {
        width: min(390px, 100%);
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 220ms linear;
      }

      .status {
        min-height: 1.6rem;
        text-align: center;
        color: var(--good);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="top">
        <h1>Meniskus-Motivator – Physio mit Augenzwinkern</h1>
        <div class="wink">😉🦵</div>
      </div>
      <section class="content">
        <article class="panel">
          <h2>Dein Plan</h2>
          <div class="grid">
            <label>
              Wiederholungen pro Satz
              <input id="reps" type="number" min="1" value="8" />
            </label>
            <label>
              Aktivphase (Sek.)
              <input id="activeSec" type="number" min="1" value="30" />
            </label>
            <label>
              Ruhe zwischen Wiederholungen (Sek.)
              <input id="restRepSec" type="number" min="1" value="20" />
            </label>
            <label>
              Anzahl Sätze
              <input id="sets" type="number" min="1" value="3" />
            </label>
            <label>
              Satzpause (Sek.)
              <input id="restSetSec" type="number" min="1" value="90" />
            </label>
          </div>
          <div class="buttons">
            <button class="start" id="startBtn">Start 🚀</button>
            <button class="pause" id="pauseBtn">Pause ⏸️</button>
            <button class="reset" id="resetBtn">Reset 🔄</button>
          </div>
        </article>

        <article class="panel timer-face">
          <div class="knee-wrap" aria-hidden="true">
            <svg class="knee" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="leg1" x1="0" x2="1">
                  <stop offset="0%" stop-color="#ffd7c0" />
                  <stop offset="100%" stop-color="#f2b9a0" />
                </linearGradient>
                <linearGradient id="leg2" x1="0" x2="1">
                  <stop offset="0%" stop-color="#ffdcca" />
                  <stop offset="100%" stop-color="#f6c0a8" />
                </linearGradient>
              </defs>
              <rect x="28" y="38" width="78" height="128" rx="34" fill="url(#leg1)"/>
              <rect x="110" y="76" width="82" height="112" rx="34" fill="url(#leg2)"/>
              <circle class="joint" id="joint" cx="108" cy="115" r="25" fill="#ff6f79"/>
              <circle cx="108" cy="115" r="10" fill="#fff4f6"/>
              <path d="M84 123 Q108 144 132 123" stroke="#ffffffaa" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="phase" id="phase">Bereit für den Start ✨</div>
          <div class="clock" id="clock">00:00</div>
          <div class="progress"><div class="bar" id="bar"></div></div>
          <div class="meta">
            <span class="chip" id="setInfo">Satz 1/1</span>
            <span class="chip" id="repInfo">Wdh 0/0</span>
          </div>
          <div class="status" id="status">Du packst das! Dein Knie feiert jeden Fortschritt. 🦵🎉</div>
        </article>
      </section>
    </main>

    <script>
      const refs = {
        reps: document.getElementById("reps"),
        activeSec: document.getElementById("activeSec"),
        restRepSec: document.getElementById("restRepSec"),
        sets: document.getElementById("sets"),
        restSetSec: document.getElementById("restSetSec"),
        startBtn: document.getElementById("startBtn"),
        pauseBtn: document.getElementById("pauseBtn"),
        resetBtn: document.getElementById("resetBtn"),
        phase: document.getElementById("phase"),
        clock: document.getElementById("clock"),
        setInfo: document.getElementById("setInfo"),
        repInfo: document.getElementById("repInfo"),
        bar: document.getElementById("bar"),
        status: document.getElementById("status"),
        joint: document.getElementById("joint")
      };

      let timer = null;
      let config = null;
      let state = null;

      const funnyMessages = [
        "Stark! Dein Knie bekommt VIP-Service. 😎",
        "Sauber! Meniskus sagt: Weiter so! 👏",
        "Schöne Kontrolle – Physio-Level steigt! 🧠",
        "Das war elegant. Fast schon Knie-Ballett. 🩰",
        "Brav durchgezogen. Bonuspunkte fürs Dranbleiben! 🌟"
      ];

      function clampInt(value, fallback) {
        const n = Number.parseInt(value, 10);
        return Number.isFinite(n) && n > 0 ? n : fallback;
      }

      function readConfig() {
        return {
          reps: clampInt(refs.reps.value, 8),
          activeSec: clampInt(refs.activeSec.value, 30),
          restRepSec: clampInt(refs.restRepSec.value, 20),
          sets: clampInt(refs.sets.value, 3),
          restSetSec: clampInt(refs.restSetSec.value, 90)
        };
      }

      function fmt(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return `${m}:${s}`;
      }

      function setupState() {
        state = {
          running: false,
          set: 1,
          rep: 1,
          phase: "active",
          phaseRemaining: config.activeSec,
          phaseDuration: config.activeSec,
          completedPhases: 0,
          totalPhases: config.sets * config.reps * 2 + (config.sets - 1)
        };
      }

      function updateUi() {
        const labels = {
          active: "Aktivphase – konzentriert arbeiten 💪",
          restRep: "Kurze Ruhe – locker atmen 😮‍💨",
          restSet: "Satzpause – kurz regenerieren 🧃",
          done: "Fertig! Knie-Party aktiviert 🎉"
        };

        refs.phase.textContent = labels[state.phase] || "Los geht's";
        refs.clock.textContent = fmt(Math.max(0, state.phaseRemaining));
        refs.setInfo.textContent = `Satz ${Math.min(state.set, config.sets)}/${config.sets}`;
        refs.repInfo.textContent = `Wdh ${Math.min(state.rep, config.reps)}/${config.reps}`;

        const progress = (state.completedPhases / Math.max(1, state.totalPhases)) * 100;
        refs.bar.style.width = `${Math.min(progress, 100)}%`;

        refs.joint.classList.toggle("resting", state.phase !== "active");
      }

      function phaseDone() {
        state.completedPhases += 1;

        if (state.phase === "active") {
          if (state.rep < config.reps) {
            state.phase = "restRep";
            state.phaseRemaining = config.restRepSec;
            state.phaseDuration = config.restRepSec;
          } else if (state.set < config.sets) {
            state.phase = "restSet";
            state.phaseRemaining = config.restSetSec;
            state.phaseDuration = config.restSetSec;
          } else {
            finishTraining();
            return;
          }
          refs.status.textContent = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
        } else if (state.phase === "restRep") {
          state.rep += 1;
          state.phase = "active";
          state.phaseRemaining = config.activeSec;
          state.phaseDuration = config.activeSec;
        } else if (state.phase === "restSet") {
          state.set += 1;
          state.rep = 1;
          state.phase = "active";
          state.phaseRemaining = config.activeSec;
          state.phaseDuration = config.activeSec;
          refs.status.textContent = `Satz ${state.set}: Du bist zurück im Ring! 🥊`;
        }
      }

      function tick() {
        if (!state.running) {
          return;
        }

        state.phaseRemaining -= 1;

        if (state.phaseRemaining <= 0) {
          phaseDone();
        }

        updateUi();
      }

      function start() {
        if (!state || state.phase === "done") {
          config = readConfig();
          setupState();
        }

        if (state.running) {
          return;
        }

        state.running = true;
        refs.status.textContent = "Timer läuft – du bist ein Vorbild an Regelmässigkeit. ✨";
        updateUi();

        clearInterval(timer);
        timer = setInterval(tick, 1000);
      }

      function pause() {
        if (!state) return;
        state.running = false;
        clearInterval(timer);
        refs.status.textContent = "Pause gedrückt. Kurz schütteln, dann weiter!";
      }

      function reset() {
        clearInterval(timer);
        config = readConfig();
        setupState();
        state.running = false;
        refs.status.textContent = "Reset erledigt. Bereit für den nächsten Mini-Sieg. 🏁";
        updateUi();
      }

      function finishTraining() {
        clearInterval(timer);
        state.running = false;
        state.phase = "done";
        state.phaseRemaining = 0;
        refs.bar.style.width = "100%";
        refs.status.textContent = "Abgeschlossen! Knie glücklich, du glücklich. Mega! 🦵🥳";
      }

      refs.startBtn.addEventListener("click", start);
      refs.pauseBtn.addEventListener("click", pause);
      refs.resetBtn.addEventListener("click", reset);

      [refs.reps, refs.activeSec, refs.restRepSec, refs.sets, refs.restSetSec].forEach((input) => {
        input.addEventListener("change", () => {
          if (!state || !state.running) {
            reset();
          }
        });
      });

      config = readConfig();
      setupState();
      updateUi();
    </script>
  </body>
</html>
